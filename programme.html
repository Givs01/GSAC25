<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Data Injection</title>
    <script>
        async function fetchData() {
            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxQMY0Yb7VfC9I4ddAb6S1KA6WQ2xTc9xcSVlA0SwXUeOhkkpuO1RyNcVsk_ivoSNFI2w/exec');
                const data = await response.json();
                console.log(data); // Debugging: check the structure

                // Assuming data is an array of objects
                const container = document.getElementById("data-container");
                container.innerHTML = JSON.stringify(data, null, 2); // Pretty-print JSON

                // Example: Display data dynamically in a list
                if (Array.isArray(data)) {
                    container.innerHTML = "";
                    data.forEach(item => {
                        const div = document.createElement("div");
                        div.textContent = JSON.stringify(item);
                        container.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        window.onload = fetchData;
    </script>
</head>
<body>
    <h1>JSON Data</h1>
    <pre id="data-container">Loading...</pre>
</body>
</html>
